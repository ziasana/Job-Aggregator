services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME:-job_aggregator}
      POSTGRES_USER: ${DB_USER:-job_aggregator}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-job_aggregator}
    ports:
      - "${DB_PORT:-5434}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
